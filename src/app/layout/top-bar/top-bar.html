<header
  class="hidden h-16 items-center justify-between border-b border-slate-200 bg-white px-6 md:flex dark:border-slate-800 dark:bg-slate-950"
>
  <span class="font-display text-lg font-semibold text-slate-800 dark:text-slate-100">PCintegrado</span>

  <nav class="flex items-center gap-6">
    <a
      class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400"
      routerLink="/"
      routerLinkActive="text-blue-600"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Painel
    </a>
    <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/lancamento" routerLinkActive="text-blue-600">
      Painel do PC
    </a>
    @if (podeVerPoliciais()) {
      <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/policiais" routerLinkActive="text-blue-600">
        Policiais
      </a>
    }
    @if (podeGerenciarEscalas()) {
      <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/escala-mensal" routerLinkActive="text-blue-600">
        Escala Mensal
      </a>
    }
    @if (podeGerarRelatorioSei()) {
      <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/relatorio-original" routerLinkActive="text-blue-600">
        Relatório Original
      </a>
    }
    @if (podeGerarRelatorioSei()) {
      <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/relatorio-sei" routerLinkActive="text-blue-600">
        Relatório SEI
      </a>
    }
    @if (authService.currentPerfil?.role === 'ADMIN') {
      <a class="text-slate-600 hover:text-blue-600 dark:text-slate-300 dark:hover:text-blue-400" routerLink="/admin" routerLinkActive="text-blue-600">
        Admin
      </a>
    }
    <app-theme-toggle />
    <button
      class="text-sm text-slate-500 hover:text-red-600 dark:text-slate-400 dark:hover:text-red-400"
      (click)="signOut()"
    >
      Sair
    </button>
  </nav>
</header>
